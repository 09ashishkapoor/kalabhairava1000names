name: Validate website

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  browser-validation:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python test dependency
        run: python -m pip install pytest

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Run repo smoke tests
        run: npm run test:repo

      - name: Run browser smoke suite
        run: npm run test:e2e

      - name: Run visual regression suite
        run: npm run test:visual

      - name: Run performance budget suite
        run: npm run test:perf

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  links:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check markdown and html links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --no-progress
            --verbose
            --root-dir "${{ github.workspace }}"
            --accept 200,206,429
            ./README.md
            ./DEPLOYMENT.md
            ./index.html
            ./info.html
