name: Auto Version Bump

permissions:
  contents: write

concurrency:
  group: version-bump-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'version.txt'
      - 'last-updated.txt'
      - '.github/**'

jobs:
  bump-version:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
      
      - name: Increment version
        run: |
          chmod +x increment_version.sh
          ./increment_version.sh
      
      - name: Check for changes
        id: check_changes
        run: |
          # Detect any staged or unstaged changes caused by the increment script
          # Use git status --porcelain which shows staged (index) and unstaged changes
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git add version.txt last-updated.txt sitemap.xml || true
          # commit only if there are staged changes
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: bump version [skip ci]" || true

          # Ensure we don't fail on transient errors; pull --rebase then push with retries
          attempt=0
          until [ $attempt -ge 4 ]
          do
            if git pull --rebase origin main; then
              if git push origin main; then
                echo "Push succeeded"
                break
              else
                echo "Push failed, will retry"
              fi
            else
              echo "Pull --rebase failed, will retry"
            fi
            attempt=$((attempt+1))
            sleep $((attempt * 2))
          done
          if [ $attempt -ge 4 ]; then
            echo "Failed to push changes after retries" >&2
            exit 1
          fi
